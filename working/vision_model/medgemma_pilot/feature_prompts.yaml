# Feature config for the MedGemma pilot.
#
# prompts.build_system_text() turns each feature below into ONE system message:
#   role (prompts.SYSTEM_ROLE)
#   + description       (this file: what the feature IS)
#   + label_definitions (this file, optional: what each label means)
#   + task              (this file: what to decide)
#   + answer format     (built in code from label_options)
# The per-image context (modality/plane/location/contour) is added separately in
# code (prompts.build_context), so all feature-specific WORDING lives here and
# nothing about the vocabulary is hardcoded in the script.
#
# Per feature:
#   label_options:      the fixed vocabulary; parsing matches ONLY these (case-insensitive)
#   description:        one-sentence definition of the feature (goes into the prompt verbatim)
#   label_definitions:  optional {label: meaning} to disambiguate the vocabulary
#   task:               the instruction telling the model what to decide
#   examples:           optional; few-shot exemplars used only with `--num-few-shot N > 0`.
#                       Each is a HELD-OUT labeled image, prepended as a
#                       (user image -> assistant label) turn. Example images are
#                       auto-excluded from inference (leakage guard), but curate
#                       them from cases you do NOT score. Fields per example:
#                         image_path: (required) relative to THIS yaml's dir, or absolute
#                         label:      (required) exactly one of label_options
#                         modality/plane/location/has_contour: (optional) context for the example

features:
  shape:
    label_options: [oval, lobulated, geographic, irregular, exophytic]
    description: "The overall shape of the lesion's margin/contour as seen on this MRI slice."
    label_definitions:
      oval: "a smooth, round or elliptical margin"
      lobulated: "a smooth but undulating, multi-lobed margin"
      irregular: "an ill-defined, jagged or spiculated margin"
    task: "Decide which single descriptor best matches the lesion's margin."
    # Few-shot examples (used only with --num-few-shot N>0). Uncomment and point
    # image_path at HELD-OUT labeled crops; label must be one of label_options.
    # examples:
    #   - image_path: examples/shape/oval_case12_ax.png
    #     label: oval
    #     modality: T2FS
    #     plane: axial
    #     location: "distal femur, metaphysis"
    #   - image_path: examples/shape/irregular_case07_cor.png
    #     label: irregular
    #     modality: T1
    #     plane: coronal
    #     location: "proximal tibia"

  enhancement:
    label_options: [homogeneous, heterogeneous, none]
    description: "The pattern of contrast enhancement within the lesion on post-contrast (post-gadolinium T1) MRI."
    label_definitions:
      homogeneous: "uniform enhancement throughout the lesion"
      heterogeneous: "patchy, mixed or non-uniform enhancement, or enhancement sparing part of the lesion"
      none: "no appreciable enhancement relative to the pre-contrast signal"
    task: "Decide which single pattern best describes the enhancement."
    # examples:
    #   - image_path: examples/enhancement/homogeneous_case03_ax.png
    #     label: homogeneous
    #     modality: T1FSC        # post-contrast (fat-sat T1 + gadolinium)
    #     plane: axial
    #   - image_path: examples/enhancement/heterogeneous_case21_sag.png
    #     label: heterogeneous
    #     modality: T1FSC
    #     plane: sagittal

  fluid_fluid_level:
    label_options: [present, absent]
    description: >-
      A fluid-fluid level is a horizontal interface between two non-mixing fluids
      of different signal intensity that have settled by gravity within the
      lesion, best seen on T2-weighted images (classically in aneurysmal bone
      cysts and telangiectatic osteosarcoma).
    task: "State whether a fluid-fluid level is present or absent."
    # examples:
    #   - image_path: examples/fluid_fluid_level/present_case05_ax.png
    #     label: present
    #     modality: T2FS
    #     plane: axial
    #   - image_path: examples/fluid_fluid_level/absent_case18_ax.png
    #     label: absent
    #     modality: T2FS
    #     plane: axial

  soft_tissue_invasion:
    label_options: [present, absent]
    description: "Soft-tissue invasion is tumour extension through the bone cortex into the adjacent soft tissues, forming an extraosseous soft-tissue component."
    task: "State whether soft-tissue invasion is present or absent."
    # examples:
    #   - image_path: examples/soft_tissue_invasion/present_case09_ax.png
    #     label: present
    #     modality: T2FS
    #     plane: axial
    #     location: "distal femur"
    #   - image_path: examples/soft_tissue_invasion/absent_case14_ax.png
    #     label: absent
    #     modality: T2FS
    #     plane: axial
