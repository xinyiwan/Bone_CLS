# Feature config for the MedGemma pilot.
#
# prompts.build_system_text() turns each feature below into ONE system message:
#   role (prompts.SYSTEM_ROLE)
#   + description       (this file: what the feature IS)
#   + label_definitions (this file, optional: what each label means)
#   + task              (this file: what to decide)
#   + answer format     (built in code from label_options)
# The per-image context (modality/plane/location/contour) is added separately in
# code (prompts.build_context), so all feature-specific WORDING lives here and
# nothing about the vocabulary is hardcoded in the script.
#
# WHICH FIELDS DRIVE ZERO-SHOT vs FEW-SHOT:
#   Zero-shot (default, --num-few-shot 0): only description + label_definitions +
#   task reach the model. To make the model DISTINGUISH labels better, tune
#   label_definitions -- make each one say how it differs from the others.
#   Few-shot (--num-few-shot N>0): the examples below are ALSO prepended, and
#   each example's `reason` is shown as the exemplar's JSON answer. The `reason`
#   fields are IGNORED in zero-shot.
#
# Per feature:
#   label_options:      the fixed vocabulary; parsing matches ONLY these (case-insensitive)
#   description:        one-sentence definition of the feature (goes into the prompt verbatim)
#   label_definitions:  optional {label: meaning}; the main lever for label discrimination
#   task:               the instruction telling the model what to decide
#   examples:           optional; few-shot exemplars used only with `--num-few-shot N > 0`.
#                       Each is a HELD-OUT labeled image, prepended as a
#                       (user image -> assistant {"prediction","reason"}) turn.
#                       Example images are auto-excluded from inference (leakage
#                       guard), but curate them from cases you do NOT score. Fields:
#                         image_path: (required) relative to THIS yaml's dir, or absolute
#                         label:      (required) exactly one of label_options
#                         reason:     (optional) shown in the exemplar JSON answer
#                         modality/plane/location/has_contour: (optional) context

features:
  shape:
    # label_options use the EXACT ground-truth vocabulary from the assessment
    # JSON (tumor_shape), so a prediction is scored correct by a direct
    # case-insensitive match -- no mapping layer needed. Keep these strings
    # identical to the assessment values.
    label_options: ["Round/Oval", lobulated, irregular]
    description: "The overall shape of the lesion's outer margin/contour as seen on this MRI slice."
    # Used INSTEAD of `description` when the stack arm is selected; the wording
    # above asserts a single slice, which is false there.
    description_stack: >-
      The overall three-dimensional shape of the lesion's outer margin/contour,
      as seen across the stack of slices.
    # Used INSTEAD of `task` under free text. `task` tells the model to choose a
    # label, which is exactly what the free-text arm withholds.
    # Worded to hold for BOTH arms (one slice or a stack), since output_mode and
    # input_mode are set independently -- hence "in what you are shown" rather
    # than "in the image"/"across the slices".
    # NAME NO SHAPE TERMS HERE. An earlier version read "whether it is smooth,
    # lobed, jagged, or something else" -- which is round_oval/lobulated/irregular
    # in plain adjectives, so the answers came back in that vocabulary and it was
    # impossible to tell the model's own reading from an echo of the prompt.
    # "or something else" does not undo the anchoring. Ask about the boundary;
    # let the model supply the words.
    free_text_task: >-
      Describe the shape of this lesion's outer margin: trace how the boundary
      runs the whole way around and say what it does. Explain what in what you
      are shown leads you to that description. Do not assess internal
      composition or anything outside the margin.
    # Each definition says how the label DIFFERS from the others, so the model
    # can pick exactly one. Discriminating axes: number of convex bulges,
    # inward (concave) vs outward (convex) curvature, smooth/organised vs jagged,
    # and whether a focal protrusion sticks out past the main mass.
    label_definitions:
      "Round/Oval": >-
        Round/Oval — the outer boundary is one smooth, continuous curve; 
        the internal nodular foci sit inside that envelope without pushing out to 
        create separate bulges reaching the margin.

      lobulated: >-
        Lobulated — the mass is made of several rounded lobes packed side by side, 
        each bulge smooth on its own but separated by shallow notches where adjacent 
        lobes meet, giving the cauliflower-like outline rather than one single curve.

      # geographic: >-
      #   Geographic — the margin sweeps as one broad, sharply demarcated concave arc, 
      #   like a scalloped bite taken out of the bone, rather than bulging outward or 
      #   breaking into jagged segments.

      irregular: >-
        Irregular — the margin has no repeatable geometry: 
        jagged, angular, ill-defined projections scattered unpredictably, 
        fitting none of the smooth-curve, lobed, or single-concave-arc patterns.

      # exophytic: >-
      #   One dominant focal protrusion projecting OUTWARD past the main boundary
      #   (mushroom-like / polypoid). Defined by that single sticking-out
      #   projection, not the shape of the main mass.
        
    task: >-
      Pick the single descriptor best matching the lesion's OUTER margin
      silhouette (not internal signal/texture). If mixed, judge the overall
      gestalt, not fine surface detail.
    # Few-shot examples (used only with --num-few-shot N>0). image_path must point
    # at HELD-OUT labeled crops; label must be one of label_options. `reason` is
    # shown as the exemplar's JSON answer, so keep it consistent with the
    # label_definitions above.
    examples:
      - image_path: /output/test/BONE_AI_113/shape/T2W_FS_coronal_11.png
        label: "Round/Oval"
        reason: >-
          Round/Oval: the outer edge is one smooth, continuous convex curve. The
          internal nodules stay inside that single boundary instead of bulging
          out to break the contour, so the outline stays uniform -- not the
          several side-by-side bulges of lobulated.
        modality: T2W_FS
        plane: coronal
        location: "femur_left"
      - image_path: /output/test/BONE_AI_134/shape/T1W_sagittal_6.png
        label: lobulated
        reason: >-
          Lobulated: the mass is built from several rounded nodules clustered
          together; where they meet, the boundary dips into shallow notches with
          thin internal septa, giving a scalloped, cauliflower-like contour of
          repeated convex bulges -- more than the single smooth curve of
          Round/Oval, yet still smooth and organised rather than the jagged edge
          of irregular.
        modality: T1W
        plane: sagittal
        location: "humerus_left"
      # - image_path: /output/test/BONE_AI_174/shape/T1W_coronal_13.png
      #   label: geographic
      #   reason: >-
      #     Geographic: the margin is sharply defined and well-demarcated, sweeping
      #     as a single broad concave arc (a bite out of the mass). The
      #     distinguishing cue is the crisp border curving inward -- not the
      #     outward convex bulges of lobulated, and not the jagged, ill-defined
      #     edge of irregular.
      #   modality: T1W
      #   plane: coronal
      #   location: "humerus_left"
      - image_path: /output/test/BONE_AI_12/shape/T2W_FS_coronal_6.png
        label: irregular
        reason: >-
          Irregular: the border has no consistent geometry -- it zigzags with
          pointed, angular projections into surrounding tissue at random
          intervals. This disordered, unpredictable edge is unlike the single
          smooth curve of Round/Oval, the repeating organised bulges of
          lobulated, or the sharply-defined concave arc of geographic.
        modality: T2W_FS
        plane: coronal
        location: "tibia_right"

