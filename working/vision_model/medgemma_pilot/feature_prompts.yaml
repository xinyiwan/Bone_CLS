# Feature config for the MedGemma pilot.
#
# prompts.build_system_text() turns each feature below into ONE system message:
#   role (prompts.SYSTEM_ROLE)
#   + description       (this file: what the feature IS)
#   + label_definitions (this file, optional: what each label means)
#   + task              (this file: what to decide)
#   + answer format     (built in code from label_options)
# The per-image context (modality/plane/location/contour) is added separately in
# code (prompts.build_context), so all feature-specific WORDING lives here and
# nothing about the vocabulary is hardcoded in the script.
#
# Per feature:
#   label_options:      the fixed vocabulary; parsing matches ONLY these (case-insensitive)
#   description:        one-sentence definition of the feature (goes into the prompt verbatim)
#   label_definitions:  optional {label: meaning} to disambiguate the vocabulary
#   task:               the instruction telling the model what to decide
#   examples:           optional; few-shot exemplars used only with `--num-few-shot N > 0`.
#                       Each is a HELD-OUT labeled image, prepended as a
#                       (user image -> assistant label) turn. Example images are
#                       auto-excluded from inference (leakage guard), but curate
#                       them from cases you do NOT score. Fields per example:
#                         image_path: (required) relative to THIS yaml's dir, or absolute
#                         label:      (required) exactly one of label_options
#                         modality/plane/location/has_contour: (optional) context for the example

features:
  shape:
    label_options: [oval, lobulated, geographic, irregular, exophytic]
    description: "The overall shape of the lesion's margin/contour as seen on this MRI slice."
    label_definitions:
      oval: "A round, elliptical, or ovoid overall outline. The margin may have minor bumps
             but the dominant shape is clearly egg-like or circular."

      lobulated: "The overall outline consists of multiple, distinct, smoothly curved
                  bulbous lobes or bumps (like a cluster of grapes). The margin does not
                  need to be perfectly smooth, but the dominant contour is wavy with
                  convex projections."

      geographic: "The overall outline is defined by a large, sweeping concave arc or
                   scalloped defect (i.e., the lesion appears to have a 'bite' taken out
                   of it). This is a broad, smooth curve, not a sharp jagged spike."

      irregular: "The overall outline is jagged, spiculated, ill-defined, or prominently
                  angular/pointy. The margin lacks a coherent round, lobular, or concave
                  pattern. This includes infiltrative or moth-eaten appearances."

      exophytic: "The overall outline shows a prominent, outward, mushroom-like or
                  polypoid convex projection extending from the main lesion mass.
                  The dominant feature is a focal protrusion beyond the expected
                  oval/lobulated boundary."
    task: >
      Decide which single descriptor best matches the lesion's global margin silhouette.
      In cases of mixed features, choose the one that best describes the *overall*
      gestalt of the lesion's shape, not the finest surface detail.
    # Few-shot examples (used only with --num-few-shot N>0). Uncomment and point
    # image_path at HELD-OUT labeled crops; label must be one of label_options.
    examples:
      - image_path: /output/test/BONE_AI_100/shape/T1W_coronal_10.png
        label: oval
        reason: "It's oval-round because its outer edge follows one smooth, continuous curve — the internal nodules stay contained inside that boundary rather than bulging out to break up the contour, so the overall shape stays uniform instead of lobulated.."
        modality: T1W
        plane: coronal
        location: "humerus_right"
      - image_path: /output/test/BONE_AI_134/shape/T1W_sagittal_6.png
        label: lobulated
        reason: "The lesion is lobulated because it's built from several rounded nodules of differing signal intensity clustered tightly together, rather than one uniform mass. 
        Where these individual nodules meet, they don't blend smoothly — instead, they push against each other with shallow indentations at the contact points and thin septations dividing them internally. 
        This nodule-within-a-mass architecture (each lobe bulging outward, separated by small dips rather than a continuous smooth curve) is what creates the scalloped, cauliflower-like outer contour seen here"
        modality: T1W
        plane: sagittal
        location: "humerus_left"
      - image_path: /output/test/BONE_AI_174/shape/T1W_coronal_13.png
        label: geographic
        reason: "It's geographic rather than oval-round or lobulated because "geographic" describes the margin/zone of transition (a sharply defined border, however the outline is shaped), while "oval-round" and "lobulated" describe the outer contour shape itself — smooth and curved versus multi-bulged. Here the emphasis is on the sharp, well-defined edge, not on whether that edge traces a round curve or a series of lobes."
        modality: T1W
        plane: coronal
        location: "humerus_left"
      - image_path: /output/test/BONE_AI_462/shape/T1W_C_sagittal_14.png
        label: irregular
        reason: "This lesion is irregular because its border has no consistent geometry — the edge zigzags unpredictably with pointed, angular projections extending into surrounding tissue at random intervals, unlike the smooth single curve of oval-round, the organized repeating bulges of lobulated, or the sharply defined single border of geographic; here the margin is disorganized and unpredictable rather than following any repeatable pattern."
        modality: T1W_C
        plane: sagittal
        location: "vertebrae"

