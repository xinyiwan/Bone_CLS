# Feature config for run.py (real BONE data + classified-sequence table).
#
# `modality` here is matched against your classifier's FINAL sequence label
# (the label column of --sequence-table), case-insensitively. `plane` is matched
# against each scan's ACQUISITION plane (inferred from the affine).
#
# Two ways to name modalities:
#   (a) put the exact classifier labels in `modality:` directly, or
#   (b) use short names below and map them in `sequence_aliases:`.
# Run `--index-only` first: it prints the available (sequence, plane) combos and,
# with this config, a coverage report -- use those exact label strings here.

# Optional: short-name -> exact-classifier-label. EDIT to match your labels.
sequence_aliases:
  T1:   T1W_nFS_nCE      # plain T1
  T1C:  T1W_nFS_CE       # T1 post-contrast (not fat-sat)
  T1FSC: T1W_FS_CE       # T1 fat-sat post-contrast
  T2FS: T2W_FS           # T2 fat-sat

features:
  - name: shape
    crop_margin_mm: 10
    top_k: 1
    crop_mode: bbox            # keep surrounding tissue for shape/margins
    requirements:
      # NOTE: axial and coronal come from two DIFFERENT acquired scans of the
      # same study -- the resolver picks each by its native acquisition plane.
      - modality: T1
        planes: [axial, coronal]

  - name: enhancement
    crop_margin_mm: 8
    top_k: 1
    crop_mode: bbox            # enhancement is read relative to nearby tissue
    requirements:
      - modality: T1FSC
        planes: [axial]

  - name: fluid_fluid_level
    crop_margin_mm: 8
    top_k: 3
    crop_mode: bbox
    requirements:
      - modality: T2FS
        planes: [axial]
